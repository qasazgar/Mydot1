runtime:
  scripts:
    - type: before-request
      code: |-
        function generatePassword() {
          const names = ["Ahmad", "Reza", "Ali", "Sara", "Mina", "Omid"];
          const name = names[Math.floor(Math.random() * names.length)];
          const numbers = Math.floor(1000 + Math.random() * 9000);

          return `${name}@${numbers}`;
        }

        const password = generatePassword();

        bru.setVar("new_password", password);

        console.log("✅ پسورد جدید:", password);
    - type: after-response
      code: |-
        let responseData = res.body;

        if (typeof responseData === "string") {
          try {
            responseData = JSON.parse(responseData);
          } catch (error) {
            responseData = {};
          }
        }

        test("Status code is 400", () => {
          expect(res.status).to.equal(400);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });

        if (responseData.message === "OTP is invalid.") {
          console.log("❌ کد OTP وارد شده صحیح نمی‌باشد");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
