runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();

        bru.setEnvVar("Product_id", data.id);
    - type: tests
      code: |-
        tests :{
          test("Status code should be 201", function() {
            expect(res.status).to.equal(201);

          });

          test("Response time should be less than 500 ms", function() {
            expect(res.responseTime).to.be.lessThan(500);
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
