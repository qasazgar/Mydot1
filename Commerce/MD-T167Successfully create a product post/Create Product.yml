        "content": "سامسونگ با Galaxy A56، میان‌رده‌ای را روانه بازار کرده است که در بسیاری از بخش‌ها با پرچم‌داران رقابت می‌کند. این گوشی با قاب پشتی و جلویی شیشه‌ای و فریم آلومینیومی، حس یک محصول لوکس را به‌خوبی منتقل می‌کند و با وزن متعادل ۱۹۸ گرمی و ضخامت ۷.۴ میلی‌متری، هم خوش‌دست است و هم با داشتن گواهی IP67 بدنه مستحکم و ضد آبی دارد. نمایشگر ۶.۷ اینچی Super AMOLED آن با نرخ نوسازی ۱۲۰ هرتز، روشنایی ۱۹۰۰ نیتی و پشتیبانی از HDR10+ تجربه بصری فوق‌العاده‌ای رقم می‌زند. در قلب A56 تراشه ۴ نانومتری Exynos 1580 قرار دارد و با تکنولوژی حافظه UFS 3.1، عملکردی سریع و روان را در اپ‌ها و بازی‌ها تضمین می‌کند. دوربین اصلی ۵۰ مگاپیکسلی با OIS، دوربین فوق‌عریض ۱۲ مگاپیکسلی و لنز ماکروی ۵ مگاپیکسلی، مجموعه‌ای کامل برای عکاسی روزمره هستند. دوربین سلفی ۱۲ مگاپیکسلی هم کیفیتی بالا و حتی امکان فیلم‌برداری 4K را فراهم می‌کند. باتری ۵۰۰۰ میلی‌آمپرساعتی A56 با شارژ سریع ۴۵ وات، تا یک روز کامل استفاده را تضمین می‌کند. این گوشی با اندروید ۱۵ و وعده ۶ سال آپدیت، یکی از آینده‌دارترین انتخاب‌ها در دنیای میان‌رده‌هاست و بی‌دلیل نیست که A56 یکی از پرفروش‌ترین گوشی‌های این روزهاست.",
        "price_type": "fixed",
        "price": 10000,
        "price_doto": null,
        "stock": 1,
        "category_id": "841b853c-dac0-4120-8015-d3a07bb815b7"
      }
