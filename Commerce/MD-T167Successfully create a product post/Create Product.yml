    data: |-
      {
        "title": "Galaxy Samsung A56 5G",
        "kind": "physical",
        "media_ids": [
          "7b84b8aa-c959-47f7-95cf-a6ae70ebf6eb",
          "ff52d686-46f3-4b19-b7cf-0ebbe1aabf83"
