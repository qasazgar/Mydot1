runtime:
  scripts:
    - type: before-request
      code: |-
        const products = [
          {
            title: "Galaxy Samsung A56 5G",
            content: "سامسونگ Galaxy A56 5G با نمایشگر Super AMOLED، دوربین قدرتمند و باتری 5000 میلی‌آمپرساعتی؛ انتخابی مناسب برای استفاده روزمره و حرفه‌ای.",
            price: 110000,
            price_doto: null,
            stock: 14
          },
          {
            title: "iPhone 17 Pro",
            content: "آیفون 17 پرو با طراحی پریمیوم، دوربین پیشرفته، پردازنده قدرتمند و نمایشگر باکیفیت برای کاربران حرفه‌ای.",
            price: 185000,
            price_doto: null,
            stock: 8
          },
          {
            title: "Samsung Galaxy S25 Ultra",
            content: "Galaxy S25 Ultra با نمایشگر بزرگ، دوربین حرفه‌ای، قلم S Pen و عملکرد قدرتمند یکی از پرچم‌داران سامسونگ است.",
            price: 175000,
            price_doto: null,
            stock: 6
          },
          {
            title: "Xiaomi 15 Pro",
            content: "Xiaomi 15 Pro با پردازنده قدرتمند، نمایشگر AMOLED و سیستم دوربین حرفه‌ای، گزینه‌ای مناسب برای کاربران حرفه‌ای است.",
            price: 135000,
            price_doto: null,
            stock: 12
          },
          {
            title: "Google Pixel 10 Pro",
            content: "Pixel 10 Pro با دوربین قدرتمند، تجربه خالص اندروید و قابلیت‌های هوش مصنوعی گوگل عرضه شده است.",
            price: 145000,
            price_doto: null,
            stock: 9
          },
          {
            title: "OnePlus 13",
            content: "OnePlus 13 با عملکرد سریع، نمایشگر با نرخ نوسازی بالا و باتری قدرتمند برای کاربران علاقه‌مند به عملکرد بالا طراحی شده است.",
            price: 120000,
            price_doto: null,
            stock: 15
          },
          {
            title: "Sony WH-1000XM6",
            content: "هدفون Sony WH-1000XM6 با حذف نویز فعال، کیفیت صدای بالا و طراحی راحت برای استفاده طولانی‌مدت مناسب است.",
            price: 75000,
            price_doto: null,
            stock: 20
          },
          {
            title: "Apple Watch Ultra 3",
            content: "Apple Watch Ultra 3 با طراحی مقاوم، قابلیت‌های ورزشی پیشرفته و امکانات هوشمند برای کاربران حرفه‌ای طراحی شده است.",
            price: 95000,
            price_doto: null,
            stock: 7
          },
          {
            title: "Samsung Galaxy Buds 4 Pro",
            content: "Galaxy Buds 4 Pro با کیفیت صدای بالا، حذف نویز فعال و اتصال سریع به دستگاه‌های سامسونگ ارائه شده است.",
            price: 42000,
            price_doto: null,
            stock: 25
          },
          {
            title: "MacBook Air M4",
            content: "MacBook Air با تراشه M4، طراحی باریک و سبک، عمر باتری بالا و عملکرد مناسب برای کارهای روزمره و حرفه‌ای.",
            price: 210000,
            price_doto: null,
            stock: 5
          }
        ];

        // انتخاب Random یک محصول کامل
        const selectedProduct = products[Math.floor(Math.random() * products.length)];

        // ذخیره متغیرها
        bru.setVar("product_title", selectedProduct.title);
        bru.setVar("product_content", selectedProduct.content);
        bru.setVar("product_price", selectedProduct.price);
        bru.setVar("product_price_doto", selectedProduct.price_doto);
        bru.setVar("product_stock", selectedProduct.stock);

        // نمایش در Console
        console.log("Selected Product:", selectedProduct);
        console.log("Title:", selectedProduct.title);
        console.log("Content:", selectedProduct.content);
        console.log("Price:", selectedProduct.price);
        console.log("Price DOTO:", selectedProduct.price_doto);
        console.log("Stock:", selectedProduct.stock);
    - type: after-response
      code: |-
        const data = res.getBody();

        bru.setEnvVar("Product_id", data.id);
    - type: tests
      code: |-
        tests :{
          test("Status code should be 201", function() {
            expect(res.status).to.equal(201);

          });

          test("Response time should be less than 500 ms", function() {
            expect(res.responseTime).to.be.lessThan(500);
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
