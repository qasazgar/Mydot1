runtime:
  scripts:
    - type: after-response
      code: |-
        let responseData = res.body;

        if (typeof responseData === "string") {
          try {
            responseData = JSON.parse(responseData);
          } catch (error) {
            responseData = {};
          }
        }

        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });

        if (responseData.status === "cancelled") {
          console.log("✅ لغو دعوت با موفقیت انجام شد");
        } else {
          console.log("❌ لغو دعوت انجام نشد");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
