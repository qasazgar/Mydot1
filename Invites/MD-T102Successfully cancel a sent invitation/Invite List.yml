runtime:
  scripts:
    - type: after-response
      code: |-
        let responseData = res.body;

        if (typeof responseData === "string") {
          try {
            responseData = JSON.parse(responseData);
          } catch (error) {
            responseData = {};
          }
        }

        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });

        if (
          responseData.results &&
          responseData.results.length > 0
        ) {
          const firstInvite = responseData.results[0];

          bru.setVar("invite_id", firstInvite.id);
          bru.setVar("invitee_phone_number", firstInvite.invitee_phone_number);
          bru.setVar("invite_status", firstInvite.status);
          bru.setVar("invite_created_at", firstInvite.created_at);
          bru.setVar("invite_expires_at", firstInvite.expires_at);
          bru.setVar("invite_used_at", firstInvite.used_at);

          console.log("✅ اطلاعات آخرین دعوت با موفقیت ذخیره شد");
          console.log("Invite ID:", firstInvite.id);
          console.log("Phone:", firstInvite.invitee_phone_number);
          console.log("Status:", firstInvite.status);
        } else {
          console.log("❌ هیچ دعوتی در لیست پیدا نشد");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
