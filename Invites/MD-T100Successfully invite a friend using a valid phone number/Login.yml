      value: application/json, text/plain, */*
    - name: accept-language
      value: en-US,en;q=0.9,fa-IR;q=0.8,fa;q=0.7
    - name: content-type
      value: application/json
    - name: Cookie
      value: amplitude_idundefineddpsb.ir=eyJvcHRPdXQiOmZhbHNlLCJzZXNzaW9uSWQiOm51bGwsImxhc3RFdmVudFRpbWUiOm51bGwsImV2ZW50SWQiOjAsImlkZW50aWZ5SWQiOjAsInNlcXVlbmNlTnVtYmVyIjowfQ==; ajs_user_id=0e6ca19084243e1aec287f62ca6fc06f0a23c423675122ed14a566ecdbdbccd6; ajs_anonymous_id=2cef3627-7769-461c-9d28-9625b361576f; ajs_group_id=BEW1-OXXH-RIZ6-B6K4; amplitude_id_cf620211dc906be4ab7c92f52766759ddpsb.
    - name: origin
      value: https://stage.dpsb.ir
    - name: priority
      value: u=1, i
    - name: referer
      value: https://stage.dpsb.ir/
    - name: sec-ch-ua
      value: '"Chromium";v="154", "Google Chrome";v="154", "Not A(Brand";v="99"'
