  body:
    type: json
    data: |-
      {
        "identifier": "{{User1}}",
        "password": "{{Password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        let responseData = res.body;

        if (typeof responseData === "string") {
          try {
            responseData = JSON.parse(responseData);
          } catch (error) {
            responseData = {};
          }
        }

        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });

        if (
          responseData.user &&
          responseData.user.id
        ) {
          console.log("✅ ورود با نام کاربری و رمز عبور با موفقیت انجام شد");
        } else {
          console.log("❌ ورود انجام نشد");
        }

        // Get Set-Cookie
        const setCookie = res.getHeader("set-cookie");

        if (setCookie) {
          const cookieString = Array.isArray(setCookie)
            ? setCookie.join("; ")
            : String(setCookie);

          const accessTokenMatch = cookieString.match(/access_token=([^;]+)/);

          if (accessTokenMatch) {
            bru.setVar("access_token", accessTokenMatch[1]);
            console.log("✅ access_token با موفقیت ذخیره شد");
          } else {
            console.log("❌ access_token در Response پیدا نشد");
          }
        } else {
          console.log("❌ Set-Cookie در Response وجود ندارد");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
