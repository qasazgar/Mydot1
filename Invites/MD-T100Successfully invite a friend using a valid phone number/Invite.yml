runtime:
  scripts:
    - type: before-request
      code: |-
        function generatePhoneNumber() {
          const prefix = "0912";
          const randomNumber = Math.floor(1000000 + Math.random() * 9000000);

          return prefix + randomNumber;
        }

        const phoneNumber = generatePhoneNumber();

        bru.setVar("random_phone_number", phoneNumber);
    - type: after-response
      code: |-
        let responseData = res.body;

        if (typeof responseData === "string") {
          try {
            responseData = JSON.parse(responseData);
          } catch (error) {
            responseData = {};
          }
        }

        test("Status code is 201", () => {
          expect(res.status).to.equal(201);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });

        const isSuccessful =
          res.status === 201 &&
          responseData.id &&
          responseData.invitee_phone_number === null &&
          responseData.status === "pending" &&
          responseData.expires_at &&
          responseData.created_at;

        if (isSuccessful) {
          console.log("✅ دعوت با موفقیت انجام شد");
        } else {
          console.log("❌ دعوت انجام نشد");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
