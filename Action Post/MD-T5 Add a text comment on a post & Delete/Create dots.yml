info:
  name: Create dots
  type: http
  seq: 2

http:
  method: POST
  url: "{{Url}}/dots/"
  headers:
    - name: accept
      value: application/json, text/plain, */*
    - name: accept-language
      value: en-GB,en;q=0.9,fa-IR;q=0.8,fa;q=0.7,en-US;q=0.6
    - name: cache-control
      value: no-cache
    - name: content-type
      value: application/json
    - name: Cookie
      value: _clck=1dpuog2%5E2%5Eg94%5E0%5E2436; csrftoken=zW1JmrDBXfRRfND42R2kAUu9NxrLk7rq; sessionid=4s5ilw7lw0jjs4t3obux07rs31f8mubv
    - name: origin
      value: https://stage.dpsb.ir
    - name: pragma
      value: no-cache
    - name: priority
      value: u=1, i
    - name: referer
      value: https://stage.dpsb.ir/
    - name: sec-ch-ua
      value: '"Chromium";v="154", "Google Chrome";v="154", "Not A(Brand";v="99"'
    - name: sec-ch-ua-mobile
      value: ?0
    - name: sec-ch-ua-platform
      value: '"Windows"'
    - name: sec-fetch-dest
      value: empty
    - name: sec-fetch-mode
      value: cors
    - name: sec-fetch-site
      value: same-site
    - name: user-agent
      value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36
  body:
    type: json
    data: |-
      {
        "dot_type": "dot",
        "content": "test",
        "reply_to": null,
        "repost_of": null,
        "quote_of": null,
        "media_ids": [],
        "reply_permission": "everyone"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const dotId = res.body.id;

        bru.setVar("dot_id", dotId);
    - type: tests
      code: |-
        tests :{
          test("Status code should be 201", function() {
            expect(res.status).to.equal(201);
          });

          test("Response time should be less than 1000 ms", function() {
            expect(res.responseTime).to.be.lessThan(1000);
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
