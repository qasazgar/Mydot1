info:
  name: "Repost Post "
  type: http
  seq: 3

http:
  method: post
  url: "{{Url}}/dots/"
  headers:
    - name: sec-ch-ua-platform
      value: '"iOS"'
    - name: Referer
      value: https://mydot.one/
    - name: Accept
      value: application/json, text/plain, */*
    - name: sec-ch-ua
      value: '"Chromium";v="152", "Not?A_Brand";v="24", "Google Chrome";v="152"'
    - name: Content-Type
      value: application/json
    - name: sec-ch-ua-mobile
      value: ?1
  body:
    type: json
    data: |-
      {
        "dot_type": "repost",
        "reply_to": null,
        "repost_of": "{{dot_id}}",
        "quote_of": null,
        "media_ids": [],
        "reply_permission": "everyone",
        "publication_status": "published"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        tests :{
          test("Status code should be 201", function() {
            expect(res.status).to.equal(201);
          });

          test("Response time should be less than 500 ms", function() {
            expect(res.responseTime).to.be.lessThan(1000);
          });
        }

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
