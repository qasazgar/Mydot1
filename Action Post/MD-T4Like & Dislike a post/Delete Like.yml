info:
  name: Delete Like
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{Url}}/dots/{{dot_id}}/like/"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        tests :{
          test("Status code should be 204", function() {
            expect(res.status).to.equal(204);
          });

          test("Response time should be less than 1000 ms", function() {
            expect(res.responseTime).to.be.lessThan(1000);
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
