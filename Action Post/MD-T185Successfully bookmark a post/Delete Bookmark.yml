runtime:
  scripts:
    - type: after-response
      code: |-
        const message = res.getBody().message;

        bru.setVar("error_message", message);
    - type: tests
      code: |-
        tests :{
          test("Status code should be 204", function() {
            expect(res.status).to.equal(204);

          });

          test("Response time should be less than 500 ms", function() {
            expect(res.responseTime).to.be.lessThan(500);
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
