runtime:
  scripts:
    - type: before-request
      code: |-
        const reports = [
          {
            reason: "harassment",
            description: "This content contains harassment or targeted abusive behavior."
          },
          {
            reason: "misinformation",
            description: "This content contains misleading or false information."
          },
          {
            reason: "obscene",
            description: "This content contains obscene or inappropriate material."
          },
          {
            reason: "spam",
            description: "This content appears to be spam or unwanted promotional content."
          },
          {
            reason: "hate",
            description: "This content contains hateful or discriminatory content."
          },
          {
            reason: "other",
            description: "This content violates the platform rules for another reason."
          }
        ];

        // انتخاب Random یک گزارش
        const selectedReport = reports[Math.floor(Math.random() * reports.length)];

        // ذخیره متغیرها
        bru.setVar("reason", selectedReport.reason);
        bru.setVar("description", selectedReport.description);

        // نمایش در Console
        console.log("Selected Report:", selectedReport);
        console.log("Reason:", selectedReport.reason);
        console.log("Description:", selectedReport.description);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
