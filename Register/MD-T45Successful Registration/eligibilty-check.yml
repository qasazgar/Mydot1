info:
  name: eligibilty-check
  type: http
  seq: 1

http:
  method: POST
  url: "{{Url}}/auth/register/eligibilty-check/"
  headers:
    - name: accept
      value: application/json, text/plain, */*
    - name: accept-language
      value: en-GB,en;q=0.9,fa-IR;q=0.8,fa;q=0.7,en-US;q=0.6
    - name: cache-control
      value: no-cache
    - name: content-type
      value: application/json
    - name: Cookie
      value: csrftoken=OX2M2svI670BIZThW9CtjytKGVJXsXBt; sessionid=umfkub9jyhucp0dfl95w2n946xjzsevm
    - name: origin
      value: https://stage.dpsb.ir
    - name: pragma
      value: no-cache
    - name: priority
      value: u=1, i
    - name: referer
      value: https://stage.dpsb.ir/
    - name: sec-ch-ua
      value: '"Chromium";v="152", "Not?A_Brand";v="24", "Google Chrome";v="152"'
    - name: sec-ch-ua-mobile
      value: ?0
    - name: sec-ch-ua-platform
      value: '"Windows"'
    - name: sec-fetch-dest
      value: empty
    - name: sec-fetch-mode
      value: cors
    - name: sec-fetch-site
      value: same-site
    - name: user-agent
      value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36
  body:
    type: json
    data: |-
      {
        "phone_number": "{{randomMobile}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        function generateIranianMobile() {
            const prefixes = [
                "910", "911", "912", "913", "914", "915",
                "916", "917", "918", "919",
                "990", "991", "992", "993", "994",
                "995", "996", "997", "998", "999"
            ];

            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            let number = "";

            for (let i = 0; i < 7; i++) {
                number += Math.floor(Math.random() * 10);
            }

            return `+98${prefix}${number}`;
        }

        const randomMobile = generateIranianMobile();

        bru.setVar("randomMobile", randomMobile);

        console.log("Random Mobile:", randomMobile);
    - type: after-response
      code: |-
        const body = res.getBody();

        bru.setEnvVar("eligibility_token", body.eligibility_token);
    - type: tests
      code: |-
        tests :{
          test("Status code should be 200", function() {
            expect(res.status).to.equal(200);


          });

          test("Response time should be less than 500 ms", function() {
            expect(res.responseTime).to.be.lessThan(500);
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
