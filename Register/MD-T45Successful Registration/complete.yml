info:
  name: complete
  type: http
  seq: 2

http:
  method: post
  url: "{{Url}}/auth/register/complete/"
  headers:
    - name: sec-ch-ua-platform
      value: '"Windows"'
    - name: Referer
      value: https://stage.dpsb.ir/
    - name: User-Agent
      value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36
    - name: Accept
      value: application/json, text/plain, */*
    - name: sec-ch-ua
      value: '"Chromium";v="152", "Not?A_Brand";v="24", "Google Chrome";v="152"'
    - name: Content-Type
      value: application/json
    - name: sec-ch-ua-mobile
      value: ?0
  body:
    type: json
    data: |-
      {
        "display_name": "{{randomUsername}}",
        "email": "{{randomUsername}}@gmial.com",
        "password": "Ahmad@123",
        "username": "{{randomUsername}}",
        "confirm_password": "Ahmad@123",
        "phone_number": "{{randomMobile}}",
        "eligibility_token": "{{eligibility_token}}"
      }
  auth: inherit

