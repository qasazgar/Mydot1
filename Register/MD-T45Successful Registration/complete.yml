        function randomItem(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function generateIranianUsername() {
            const firstName = randomItem(firstNames);
            const lastName = randomItem(lastNames);
            const number = Math.floor(100 + Math.random() * 900);

            const username = `${firstName}_${lastName}${number}`;

            return username.substring(0, 25);
        }

        const randomUsername = generateIranianUsername();

        bru.setVar("randomUsername", randomUsername);

        console.log("Random Username:", randomUsername);
    - type: after-response
      code: |-
        const response = res.getBody();

        bru.setVar("Otp", response.otp);


        console.log("Waiting 3 seconds before request...");

        await new Promise(resolve => setTimeout(resolve, 3000));
    - type: tests
      code: |-
        tests :{
          test("Status code should be 202", function() {
            expect(res.status).to.equal(202);
          });

          test("Response time should be less than 500 ms", function() {
            expect(res.responseTime).to.be.lessThan(500);
          });
        }

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
