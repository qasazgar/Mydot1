runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });

        let data = res.body;

        if (typeof data === "string") {
          data = JSON.parse(data);
        }

        const lastTransaction = data.items[0];

        if (lastTransaction.amount_irr === 100000) {
          console.log("✅ مبلغ 100000 ریال در لیست تراکنش‌ها با عنوان برداشت ثبت شده است");
        } else {
          console.log("❌ مبلغ 100000 ریال در لیست تراکنش‌ها ثبت نشده است");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
