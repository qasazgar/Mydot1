  method: GET
  url: "{{Url}}/payments/wallet/transactions/"
  headers:
    - name: accept
      value: application/json, text/plain, */*
    - name: accept-language
      value: en-US,en;q=0.9
    - name: Cookie
      value: access_token=eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIiwiZXhwIjoxNzkxMzg0NjYyLCJpYXQiOjE3OTEzNzg5ODcsImp0aSI6IjA2Njg5M2Y4ZDdjNjQwYjZiZGE4OWZlYWU4NDc0NWVkIiwidXNlcl9pZCI6ImJkNDkzYWFkLTQ5OTktNDk5Ny05YjQ3LWVkMjUyMjQ4YWQzNCIsInJlZnJlc2hfanRpIjoiN2ViZjBiNzRkYmQxNDkyNGIyZWU2NzUyMzAxOGUwMWYifQ.RHc5KP0Dli3SoT9kYSgL9iuf72K2Ik1IDORQLqaP4pPYSlQMYZLatFy5nht8bY5JJmLV56SdCxOTkTdsDzgJGg; is_logged_in=true
    - name: origin
      value: https://stage.dpsb.ir
    - name: priority
      value: u=1, i
    - name: referer
      value: https://stage.dpsb.ir/
    - name: sec-ch-ua
      value: '"Chromium";v="154", "Google Chrome";v="154", "Not A(Brand";v="99"'
    - name: sec-ch-ua-mobile
      value: ?0
    - name: sec-ch-ua-platform
      value: '"Windows"'
    - name: sec-fetch-dest
      value: empty
    - name: sec-fetch-mode
      value: cors
    - name: sec-fetch-site
      value: same-site
    - name: user-agent
      value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36
  params:
    - name: page
      value: "1"
      type: query
      disabled: true
    - name: page_size
      value: "20"
      type: query
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 3000ms", () => {
          expect(res.responseTime).to.be.below(3000);
        });

        let data = res.body;

        if (typeof data === "string") {
          data = JSON.parse(data);
        }

        const lastTransaction = data.items[0];

        if (
          lastTransaction.entry_type === "DEBIT" &&
          lastTransaction.amount_irr === 100000
        ) {
          console.log(
            "✅ مبلغ 100000 ریال با عنوان واریز در لیست تراکنش‌های کاربر وجود دارد"
          );
        } else {
          console.log(
            "❌ مبلغ 100000 ریال با عنوان واریز در لیست تراکنش‌های کاربر وجود ندارد"
          );
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
