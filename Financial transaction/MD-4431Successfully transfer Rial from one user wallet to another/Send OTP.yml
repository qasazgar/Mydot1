runtime:
  scripts:
    - type: after-response
      code: |-
        test("Status code is 200", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 200ms", () => {
          expect(res.responseTime).to.be.below(200);
        });

        let data = res.body;

        if (typeof data === "string") {
          data = JSON.parse(data);
        }

        bru.setVar("Otp", data.otp);

        console.log("✅ Otp ذخیره شد:", data.otp);

