info:
  name: Create dots text & Image
  type: http
  seq: 2

http:
  method: post
  url: "{{Url}}/dots/"
  headers:
    - name: accept
      value: application/json, text/plain, */*
    - name: accept-language
      value: en-GB,en;q=0.9,fa-IR;q=0.8,fa;q=0.7,en-US;q=0.6
    - name: cache-control
      value: no-cache
    - name: content-type
      value: application/json
    - name: origin
      value: https://mydot.one
    - name: pragma
      value: no-cache
    - name: priority
      value: u=1, i
    - name: referer
      value: https://mydot.one/
    - name: sec-ch-ua
      value: '"Chromium";v="152", "Not?A_Brand";v="24", "Google Chrome";v="152"'
    - name: sec-ch-ua-mobile
      value: ?1
    - name: sec-ch-ua-platform
      value: '"iOS"'
    - name: sec-fetch-dest
      value: empty
    - name: sec-fetch-mode
      value: cors
    - name: sec-fetch-site
      value: same-site
    - name: user-agent
      value: Mozilla/5.0 (iPhone; CPU iPhone OS 18_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.5 Mobile/15E148 Safari/604.1
  body:
    type: json
    data: |-
      {
        "dot_type": "dot",
        "content": "# {{post_title}}\n\n{{post_description}}",
        "reply_to": null,
        "repost_of": null,
        "quote_of": null,
        "media_ids": [
          "{{image_id}}"
        ],
        "reply_permission": "everyone"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const posts = [
          {
            title: "آیا برنامه‌نویس‌ها حذف می‌شوند؟",
            description: "شاید سؤال اشتباهی می‌پرسیم. AI در حال تغییر Coding، Testing، Documentation و Code Review است. آینده متعلق به کسی است که بهتر مسئله را می‌فهمد.",
            image_id: "a1c78386-c1cd-4fec-8589-85ed235c8124"
          },
          {
            title: "AI دیگر فقط جواب نمی‌دهد؛ عمل می‌کند",
            description: "AI Agent می‌تواند هدف بگیرد، تصمیم بگیرد، ابزار استفاده کند و یک Workflow را جلو ببرد. شاید وقت آن رسیده AI را فقط یک ابزار نبینیم.",
            image_id: "a1c78386-c1cd-4fec-8589-85ed235c8124"
          },
          {
            title: "QA در عصر AI",
            description: "AI می‌تواند Test Case تولید کند، Test Data بسازد، API تست کند و Regression اجرا کند. اما آیا واقعاً Product را می‌فهمد؟",
            image_id: "864d322d-d992-48b3-bf31-5ef74f4f3d0b"
          },
          {
            title: "آیا یک AI برای آینده کافی است؟",
            description: "یک Agent برای Requirement، یک Agent برای Coding، یک Agent برای Testing و یک Agent برای Security. آینده Software شاید ترکیبی از Human و چند AI Agent باشد.",
            image_id: "bd5a7870-f887-467e-b7dc-d74d842746fb"
          },
          {
            title: "AI بدون Chip وجود ندارد",
            description: "پشت هر AI قدرتمند، Compute قدرتمند وجود دارد. GPU، AI Accelerators، Chips و Data Centers بخش مهم رقابت آینده تکنولوژی هستند.",
            image_id: "32eefc6e-2bab-484b-b52e-24a6ca49b73b"
          }
        ];

        // انتخاب یک پست کامل
        const selectedPost = posts[Math.floor(Math.random() * posts.length)];

        // ذخیره متغیرها
        bru.setVar("post_title", selectedPost.title);
        bru.setVar("post_description", selectedPost.description);
        bru.setVar("image_id", selectedPost.image_id);

        console.log("Selected Post:", selectedPost);
    - type: after-response
      code: |-
        const dotId = res.body.id;

        bru.setVar("dot_id", dotId);
    - type: tests
      code: |-
        tests :{
          test("Status code should be 201", function() {
            expect(res.status).to.equal(201);
          });

          test("Response time should be less than 1000 ms", function() {
            expect(res.responseTime).to.be.lessThan(1000);
          });
        }

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
