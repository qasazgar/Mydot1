runtime:
  scripts:
    - type: before-request
      code: |-
        const posts = [
          {
            title: "آیا برنامه‌نویس‌ها حذف می‌شوند؟",
            description: "با ورود AI، بخش زیادی از کدنویسی در حال خودکار شدن است؛ اما مسئله اصلی حذف برنامه‌نویس نیست. برنامه‌نویسی در حال تغییر است و ارزش مهارت‌هایی مثل حل مسئله، معماری و تصمیم‌گیری بیشتر از قبل می‌شود.",
            image_id: "IMAGE_ID_1"
          },

          {
            title: "AI دیگر فقط جواب نمی‌دهد؛ عمل می‌کند",
            description: "نسل جدید AI فقط به سؤال پاسخ نمی‌دهد؛ هدف می‌گیرد، تصمیم می‌گیرد، ابزارها را اجرا می‌کند و کار را تا رسیدن به نتیجه جلو می‌برد. عصر AI Agentها تازه شروع شده است.",
            image_id: "IMAGE_ID_2"
          },

          {
            title: "QA در عصر AI",
            description: "AI می‌تواند سناریوهای تست تولید کند، APIها را بررسی کند، Test Data بسازد و Regression Test اجرا کند؛ اما کیفیت فقط اجرای تست نیست. QA باید بفهمد محصول چه مشکلی را برای کاربر حل می‌کند و چه ریسک‌هایی دارد.",
            image_id: "IMAGE_ID_3"
          },

          {
            title: "آیا یک AI برای آینده کافی است؟",
            description: "تصور کنید یک Agent نیازمندی را تحلیل کند، یکی کد بنویسد، دیگری تست کند و یک Agent دیگر امنیت را بررسی کند. آینده Software Development شاید به جای یک AI، متعلق به همکاری چندین AI Agent باشد.",
            image_id: "IMAGE_ID_4"
          },

          {
            title: "AI بدون Chip وجود ندارد",
            description: "پشت هر مدل قدرتمند AI، زیرساخت قدرتمندی قرار دارد. GPU، پردازنده‌های اختصاصی AI، تراشه‌های پیشرفته و Data Centerها ستون فقرات رقابت بزرگ تکنولوژی هستند.",
            image_id: "IMAGE_ID_5"
          }
        ];

        // انتخاب یک پست کامل به صورت Random
        const selectedPost = posts[Math.floor(Math.random() * posts.length)];

        // ذخیره متغیرها
        bru.setVar("post_title", selectedPost.title);
        bru.setVar("post_description", selectedPost.description);
        bru.setVar("image_id", selectedPost.image_id);

        console.log("Selected Post:", selectedPost);
    - type: tests
      code: |-
        tests :{
          test("Status code should be 204", function() {
            expect(res.status).to.equal(204);
          });

          test("Response time should be less than 1000 ms", function() {
            expect(res.responseTime).to.be.lessThan(1000);
          });
        }

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
